<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join an IRON WARRANT match</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1014; color: #e8e8e8; font-family: system-ui, sans-serif; }
  main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
  h1 { margin: 0 0 .25rem; font-size: 1.1rem; letter-spacing: .15em; color: #f2b01e; }
  .code { margin: 1rem 0; font-size: 2.6rem; font-weight: 700; letter-spacing: .25em; }
  p { color: #aab; line-height: 1.5; }
  a.button { display: inline-block; margin-top: .5rem; padding: .85rem 1.6rem; background: #f2b01e; color: #111; font-weight: 700; text-decoration: none; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>IRON WARRANT</h1>
  <p>You are invited to a match. Your join code:</p>
  <div class="code" id="code">------</div>
  <p>With the game installed, opening this page from your phone's browser link takes you straight in. Otherwise install the game, open Multiplayer, Join, and type the code above.</p>
  <a class="button" id="store" href="https://play.google.com/store/apps/details?id=com.ironwarrant.game">Get it on Google Play</a>
</main>
<script>
  var m = /[?&]code=([A-Za-z0-9]{6})(?:&|$)/.exec(location.search);
  if (m) document.getElementById('code').textContent = m[1].toUpperCase();
</script>
</body>
</html>
